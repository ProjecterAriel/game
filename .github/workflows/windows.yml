name: Build AeroWorld for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package.json
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AeroWorld-Windows
          path: windows/dist/*
